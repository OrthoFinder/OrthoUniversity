name: Test notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allows manual "Run workflow" trigger from the Actions tab too

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # adjust once you know the real runtime; prevents a hung job from running forever

    strategy:
      fail-fast: false  # if you add more notebooks later, one failing won't cancel the others
      matrix:
        notebook:
          - orthofinder_demonstration.ipynb
          # add future notebooks here, one per line, e.g.:
          # - other_tool_demonstration.ipynb

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupyter + nbconvert
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel pandas

      - name: Execute notebook end-to-end
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1800 \
            --output executed_${{ matrix.notebook }} \
            "${{ matrix.notebook }}"

      - name: Upload executed notebook (for debugging on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ matrix.notebook }}
          path: executed_${{ matrix.notebook }}
